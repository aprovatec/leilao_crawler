name: Executar Robô de Leilões

on:
  schedule:
    # Roda a cada 30 minutos das 07:00 às 19:00 (horário de Brasília)
    - cron: '*/30 10-22 * * 1-5'
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Instalar Navegador Playwright
        run: |
          playwright install --with-deps chromium

      - name: Executar Varredura
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ESAJ_CPF: ${{ secrets.ESAJ_CPF }}
          ESAJ_SENHA: ${{ secrets.ESAJ_SENHA }}
        run: |
          python main.py